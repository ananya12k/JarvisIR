# temporal_dynamic windshield-water simulator (see temporal_dynamic.py)
#
# One simulator, four rain scenarios. `base` holds every parameter; each entry
# under `scenarios` overrides only what it changes (deep-merged onto base).
#   load_rain_config(path, scenario)  ->  resolved flat config
#
# Units: pixels and frames at the native 848x480 GT resolution, `fps` frames / second.
# All values are placeholder starting points, NOT calibrated physical constants.
# presets/dynamic_v1.yaml is the frozen pre-scenario reference (load it with
# --dynamic_config to reproduce dynamic_v1 exactly; newer features default off there).

base:
  fps: 30
  profile: false              # per-stage render timing (adds GPU syncs)
  warmup_frames: 300          # simulated before the first output frame (clip doesn't start dry)

  spawn:
    rate_per_second: 90       # new drops / s at rain_intensity 1.0 (Poisson); 120 -> 90 (ablation B5)
    fade_in_frames: 4
    radius_median: 5.25       # used only if size_mixture is absent
    radius_sigma: 0.45
    size_mixture:             # uneven sizes: mostly small beads + a share of big drops
      - {weight: 0.80, median: 4.5, sigma: 0.50}
      - {weight: 0.20, median: 11.0, sigma: 0.35}
    radius_min: 2.0
    radius_max: 22.0

  growth:
    rate: 0.02                # pinned drops: dV = rate * intensity * r^2 per frame
    evaporation: 0.002        # fraction of volume lost per frame

  motion:
    slide_radius: 13.5        # px; per-drop critical radius x U[slide_jitter] (ablation A1)
    slide_jitter: [0.6, 1.7]  # some small drops slide early, some grow big first
    activation_prob: 0.15     # per frame, once above the critical radius
    max_speed: 4.0            # px / frame for the largest drops
    inertia: 0.15             # velocity relaxation per frame
    pause_prob: 0.03          # stick-slip: chance per frame to get stuck
    pause_frames: [3, 12]
    lateral_wobble: 0.15      # px / frame, OU noise std
    wind_drift: 0.0           # px / frame sideways
    stop_radius_frac: 0.6     # sliding drop pins again below this x critical radius

  shape:
    num_templates: 64
    template_res: 64
    thickness_range: [0.3, 0.8]   # DropModel min/max thickness
    stretch_gain: 0.5         # stretch = 1 + gain * speed
    max_stretch: 3.0
    stretch_smooth: 0.25
    direction_smooth: 0.2
    taper: 0.6                # teardrop narrowing of the trailing side
    max_patch: 161
    renderer: batched         # batched (bucketed patches + one scatter) | loop (reference, identical maps)
    patch_buckets: [25, 41, 65, 97, 129]
    # R2 gradual shape change (off in presets/dynamic_v1.yaml)
    evolve: true
    shape_rate: [0.01, 0.03]  # rad / frame; outline morphs to a new template every ~pi / rate frames
    slide_shape_boost: 3.0    # sliding drops change shape faster
    asym_noise: 0.015         # OU noise of left/right width asymmetry
    asym_sliding_mult: 4.0
    asym_max: 0.35
    neck_gain: 0.5            # big sliding drops: taper x (1 + gain * clamp(r / slide_radius - 1, 0, 1))
    roundness: 0.5            # mix of round field into the template field (rounded front, no kite shapes)
    edge_band: 0.15           # field width of the anti-aliased edge after blending

  trails:
    lifetime_frames: 30
    width_frac: 0.35          # trail width = frac * bead radius
    strength: 1.0
    volume_loss: 0.12         # dV = loss * r * distance moved
    bead_prob: 0.04           # per frame, small bead pinches off at the tail
    blur_sigma: 1.2
    normal_gain: 4.0
    thickness: 0.12           # much weaker refraction than a bead
    alpha: 0.55
    wetness:                  # R4: persistent wet-path memory that steers later water
      enabled: true
      grid_scale: 4           # px per cell
      deposit_gain: 0.08      # wetness added per unit of trail water (capped at 1 per segment)
      drain: 0.015            # fraction lost per frame (~70-frame memory)
      max: 1.5
      steer_gain: 6.0         # sideways pull (px / frame) per unit wetness gradient per cell
      lookahead: 1.5          # x radius below the drop where the gradient is sampled
      speed_boost: 0.5        # target speed x (1 + boost * wetness)
      threshold_relief: 0.3   # slide threshold x (1 - relief * wetness)
      reuse_threshold: 0.2    # wetness counted as "existing wet path"

  rivulets:                   # R5: connected flowing water on the wetness grid (on for heavy / torrential)
    enabled: false
    threshold: 0.8            # wet-path level above which water starts to flow
    transfer: 0.3             # fraction of the excess moved into the flow per frame
    speed: 1.5                # cells / frame at ref_level (x grid_scale px)
    ref_level: 1.0
    spread: 0.15              # sideways spreading per frame
    spread_sigma: 1.0
    drain: 0.02
    wet_keep: 0.5             # a rivulet keeps its track wet
    join_threshold: 0.3       # rivulet level at which sliding drops can join it
    join_prob: 0.2            # per frame
    join_gain: 0.004          # drop volume -> rivulet level
    visible_level: 0.15
    channel_level: 0.45       # wet-path level drawn as a (continuous) rivulet channel
    channel_gain: 0.6         # channel height relative to flowing water
    min_path_cells: 6         # connected components smaller than this are not counted as paths
    ripple: 0.35              # flowing texture modulation
    normal_gain: 3.0
    thickness: 0.18
    alpha: 0.6

  merge:
    overlap_frac: 0.70        # merge when centre distance < frac * (r1 + r2); lower = stricter (ablation B5)
    impact_growth: true       # a new drop landing inside a bead feeds it (no merge event / position jump)
    bead_clearance: true      # shed beads are placed clear of the parent so they don't re-merge at once
    ease_frames: 5            # R3: drawn position / size ease to the merged state over N frames (0 = instant)

  remove:
    min_radius: 1.0
    wiper_period: null        # frames between wiper passes, null = no wiper

scenarios:
  light:                      # mostly stationary small beads, occasional big ones, few sliders
    spawn:
      rate_per_second: 30
      size_mixture:
        - {weight: 0.90, median: 4.0, sigma: 0.45}
        - {weight: 0.10, median: 10.0, sigma: 0.30}
    growth: {rate: 0.012}
    motion: {slide_radius: 16.0, max_speed: 3.0, activation_prob: 0.10}
    trails: {lifetime_frames: 20, width_frac: 0.30}

  steady: {}                  # == base (dynamic_v1): uneven sizes, regular sliding, trails, merging

  heavy:                      # bigger + faster drops, frequent impacts, growth and merging
    spawn:
      rate_per_second: 160
      size_mixture:
        - {weight: 0.70, median: 5.0, sigma: 0.50}
        - {weight: 0.30, median: 13.0, sigma: 0.35}
      radius_max: 26.0
    growth: {rate: 0.03}
    motion: {slide_radius: 12.0, max_speed: 6.0, activation_prob: 0.25}
    trails: {lifetime_frames: 45, width_frac: 0.45}
    rivulets: {enabled: true}

  torrential:                 # dense accumulation; connected flow (later stages add rivulets + film)
    spawn:
      rate_per_second: 300
      size_mixture:
        - {weight: 0.65, median: 5.0, sigma: 0.50}
        - {weight: 0.35, median: 14.0, sigma: 0.35}
      radius_max: 28.0
    growth: {rate: 0.04}
    motion: {slide_radius: 11.0, max_speed: 7.0, activation_prob: 0.35}
    trails: {lifetime_frames: 60, width_frac: 0.5}
    rivulets: {enabled: true, threshold: 0.6, transfer: 0.4, speed: 2.0, spread: 0.25}
